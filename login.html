<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Sankalp Coaching Classes</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="contact.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
</head>
<body>

<header>
  <div class="logo">SANKALP COACHING CLASSES</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="courses.html">Courses</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a class="login" href="login.html">Login</a>
  </nav>
</header>

<section class="page-title">
  <small>STUDENT PORTAL</small>
  <h1>Student <span>Login</span></h1>
  <p>Log in to see your batch and study materials.</p>
</section>

<section class="contact-wrap">
  <div class="formbox">
    <h2>Welcome Back</h2>
    <p class="sub">Use the email and password given by the institute.</p>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">

    <p id="msg" style="color:#b3261e;font-size:14px;margin-bottom:12px"></p>
    <button class="btn" id="loginBtn" type="button">Log In</button>
  </div>
</section>

<footer>
  <b>Sankalp Coaching Classes</b><br>
  Jangjeet Nagar, Agra<br>
  Phone: 1234567890
</footer>

<script>
const sb = supabase.createClient(
  "https://srgffmgmutwfvxeiwffl.supabase.co",
  "sb_publishable_UOI3Z3wQCNLFaLh0BDJHSw_mOCbK3Kw"
);

async function goToRightPage(userId) {
  const res = await sb.from("profiles").select("role").eq("id", userId).single();
  if (res.data && res.data.role === "admin") {
    window.location.href = "admin.html";
  } else {
    window.location.href = "dashboard.html";
  }
}

document.getElementById("loginBtn").addEventListener("click", async function () {
  const msg = document.getElementById("msg");
  const btn = this;
  msg.textContent = "";
  btn.textContent = "Logging in...";
  const { data, error } = await sb.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  });
  if (error) {
    msg.textContent = "Wrong email or password. Please try again.";
    btn.textContent = "Log In";
  } else {
    goToRightPage(data.user.id);
  }
});

sb.auth.getSession().then(function (r) {
  if (r.data.session) { goToRightPage(r.data.session.user.id); }
});
</script>
</body>
</html>
