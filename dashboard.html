<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Dashboard | Sankalp Coaching Classes</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="contact.css">
<style>
.mat{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--light);border:1px solid var(--olive);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.mat span{font-weight:600;color:var(--violet);font-size:14px}
.mat button{background:var(--orange);color:var(--violet);border:none;border-radius:20px;padding:8px 16px;font-weight:600;font-family:inherit;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
</head>
<body>

<header>
  <div class="logo">SANKALP COACHING CLASSES</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="courses.html">Courses</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a class="login" href="dashboard.html">Dashboard</a>
  </nav>
</header>

<section class="page-title">
  <small>STUDENT PORTAL</small>
  <h1>Welcome, <span id="name">...</span></h1>
  <p id="batchline">Loading your details...</p>
</section>

<section class="contact-wrap">
  <div class="info">
    <div><b>Your Batch</b><span id="batch">...</span></div>
    <div><b>Email</b><span id="email">...</span></div>
  </div>

  <div class="formbox">
    <h2>Study Materials</h2>
    <p class="sub" id="matsub">Loading...</p>
    <div id="matlist"></div>
    <button class="btn" id="logoutBtn" type="button">Log Out</button>
  </div>
</section>

<footer>
  <b>Sankalp Coaching Classes</b><br>
  Jangjeet Nagar, Agra<br>
  Phone: 1234567890
</footer>

<script>
const sb = supabase.createClient(
  "https://srgffmgmutwfvxeiwffl.supabase.co",
  "sb_publishable_UOI3Z3wQCNLFaLh0BDJHSw_mOCbK3Kw"
);

async function openFile(path) {
  const { data, error } = await sb.storage.from("materials").createSignedUrl(path, 120);
  if (error || !data) { alert("Could not open this file. Please try again."); return; }
  window.open(data.signedUrl, "_blank");
}

async function loadMaterials() {
  const sub = document.getElementById("matsub");
  const list = document.getElementById("matlist");
  const { data, error } = await sb.from("materials").select("title,file_path").order("created_at", { ascending: false });
  if (error) { sub.textContent = "Could not load study materials."; return; }
  if (!data || data.length === 0) { sub.textContent = "No study materials have been added for your batch yet."; return; }
  sub.textContent = "Tap Download to open a file.";
  data.forEach(function (m) {
    const row = document.createElement("div");
    row.className = "mat";
    const label = document.createElement("span");
    label.textContent = m.title;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Download";
    btn.addEventListener("click", function () { openFile(m.file_path); });
    row.appendChild(label);
    row.appendChild(btn);
    list.appendChild(row);
  });
}

async function load() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { window.location.href = "login"; return; }
  const user = data.session.user;
  document.getElementById("email").textContent = user.email;

  const res = await sb.from("profiles").select("full_name,batch").eq("id", user.id).single();
  if (res.error || !res.data) {
    document.getElementById("name").textContent = "Student";
    document.getElementById("batchline").textContent = "Your profile is not set up yet. Please contact the institute.";
    document.getElementById("batch").textContent = "Not assigned";
    document.getElementById("matsub").textContent = "";
    return;
  }
  document.getElementById("name").textContent = res.data.full_name || "Student";
  document.getElementById("batch").textContent = res.data.batch || "Not assigned";
  document.getElementById("batchline").textContent = "Batch: " + (res.data.batch || "Not assigned");
  loadMaterials();
}

document.getElementById("logoutBtn").addEventListener("click", async function () {
  await sb.auth.signOut();
  window.location.href = "login";
});

load();
</script>
</body>
</html>
